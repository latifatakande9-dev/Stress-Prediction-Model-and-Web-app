<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stress Detection</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main {
      width: min(100%, 680px); padding: clamp(24px, 6vw, 48px);
      border: 1px solid #e4e9f2; border-radius: 24px; background: #fff;
      box-shadow: 0 20px 60px rgb(26 43 77 / 9%);
    }
    .eyebrow { color: #5268c8; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.04em; }
    .intro { margin: 14px 0 28px; color: #5d677a; line-height: 1.65; }
    label { display: block; margin-bottom: 10px; font-weight: 700; }
    textarea {
      display: block; width: 100%; min-height: 180px; resize: vertical; padding: 16px;
      border: 1px solid #d5dbea; border-radius: 14px; color: inherit;
      font: inherit; line-height: 1.55;
    }
    textarea:focus { outline: 3px solid #dce3ff; border-color: #6678d4; }
    button {
      width: 100%; margin-top: 16px; padding: 14px 18px; border: 0; border-radius: 12px;
      background: #5268c8; color: #fff; font: inherit; font-weight: 750; cursor: pointer;
    }
    button:hover { background: #4055b2; }
    .message { margin-top: 22px; padding: 16px 18px; border-radius: 12px; line-height: 1.5; }
    .result { background: #eef2ff; color: #263b91; }
    .error { background: #fff0ef; color: #9c3028; }
    .disclaimer { margin: 22px 0 0; color: #737d8f; font-size: .88rem; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Text analysis</p>
    <h1>Stress Detection</h1>
    <p class="intro">Enter a post or a few sentences to get a model-based estimate.</p>
    <form action="{{ url_for('predict') }}" method="post">
      <label for="text">Your text</label>
      <textarea id="text" name="text" maxlength="10000" required
                placeholder="Write or paste text here...">{{ text or "" }}</textarea>
      <button type="submit">Analyze text</button>
    </form>
    {% if prediction %}
      <div class="message result" role="status"><strong>Result:</strong> {{ prediction }}</div>
    {% endif %}
    {% if error %}
      <div class="message error" role="alert">{{ error }}</div>
    {% endif %}
    <p class="disclaimer">
      This tool provides an estimate from text. It is not a diagnosis or a substitute
      for professional support.
    </p>
  </main>
</body>
</html>
